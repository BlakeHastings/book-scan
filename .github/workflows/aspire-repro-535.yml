name: Aspire repro 535

# TEMPORARY. Delete before this branch's pull request is opened.
#
# ROUND 1 (run 33833840718) asked which Aspire CLI CI installs and whether a
# longer wait helps. Both answers came back the other way from the issue's
# hypothesis:
#
#   floating        13.5.3   failed at 120s
#   pinned-13.4.6   13.4.6   failed at 120s
#   pinned-13.4.2   13.4.2   failed at 120s
#   floating-long   13.5.3   failed at 420s
#
# The CLI version is not it, and neither is the budget on its own. The CLI's own
# log, which no job had ever printed, says the whole start time is one
# `npm install` that the CLI runs for the TypeScript AppHost before any resource
# starts: 110s of a 120s budget in one job, 413s of a 420s budget in the other,
# still running when the CLI gave up both times. The certificate warning is
# logged after the timeout, not before it.
#
# ROUND 2, below, is the control the process asks for: the fix and the same tree
# without it, at the same moment, on the same runner pool. The failure is a slow
# registry, so it can heal on its own; a green run proves nothing unless
# something red is standing next to it.
#
#   with-the-fix       this branch as it stands
#   without-the-fix    identical, with the two changed files checked back out of
#                      master before the suite runs
#
# It runs on push to this branch rather than on workflow_dispatch, because a
# dispatch resolves the workflow through the default branch and this file is not
# there.
on:
  push:
    branches:
      - 'platform/535-**'

permissions:
  contents: read

jobs:
  probe:
    name: probe (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: with-the-fix
            revert: 'false'
          - label: without-the-fix
            revert: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache the npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-e2e-${{ runner.os }}-${{ hashFiles('web/package-lock.json', 'package-lock.json', 'e2e/package-lock.json') }}
          restore-keys: |
            npm-e2e-${{ runner.os }}-

      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install the Aspire CLI
        run: |
          version="$(node -p "require('./aspire.config.json').sdk.version")"
          curl -sSL https://aspire.dev/install.sh | bash -s -- --version "$version"
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"

      - name: Which CLI this is
        run: aspire --version

      # The control. Everything else about this job is the same, so a red here
      # beside a green above is the fix doing the work rather than the registry
      # having a better minute.
      - name: Put the fix back the way it was
        if: matrix.revert == 'true'
        run: |
          git fetch --depth=1 origin master
          git checkout FETCH_HEAD -- e2e/support/aspire.ts e2e/global-setup.ts
          git --no-pager diff --stat HEAD

      - name: Install the app
        working-directory: web
        run: node ../scripts/npm-install.mjs

      - name: Install the AppHost
        run: node scripts/npm-install.mjs

      - name: Install the suite
        working-directory: e2e
        run: node ../scripts/npm-install.mjs

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run the journeys
        working-directory: e2e
        run: npm test

      # The AppHost's own transcript, and the step that turned this from a guess
      # into a diagnosis. It is in `e2e.yml` now for the same reason.
      - name: What the CLI wrote down
        if: always()
        continue-on-error: true
        run: |
          aspire ps --non-interactive || true
          for log in "$HOME"/.aspire/logs/*.log; do
            [ -e "$log" ] || continue
            echo "===== $log ====="
            tail -c 20000 "$log"
          done
