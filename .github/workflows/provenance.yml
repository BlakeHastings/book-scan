name: Provenance

# Detection, not prevention. The ruleset at GitHub's end and
# `scripts/guard-merge.mjs` locally both refuse a direct push to master, and
# both are silent if they are switched off. This runs on the result, which a
# bypass cannot avoid producing: for every new commit on master it asks GitHub
# which pull requests that commit belongs to, and fails when the answer is none.
#
# It is the only workflow that runs on a push to master.

on:
  push:
    branches: [master]

# The check asks the API which pull requests a commit belongs to, and the
# default token cannot read pull requests unless it is asked to. Without this
# the run fails with `Resource not accessible by integration (HTTP 403)`.
permissions:
  contents: read
  pull-requests: read

jobs:
  provenance:
    name: every commit came through a pull request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The script walks back to a fixed baseline commit. A shallow clone
          # does not reach it, and the script fails loudly rather than passing
          # on a history it cannot see.
          fetch-depth: 0

      # Repeated on the merged result because a direct push, the case this
      # workflow exists to catch, never saw `ci.yml` at all.
      - name: No production data committed
        run: bash scripts/check-no-scan-data.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/check-main-provenance.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROVENANCE_BEFORE: ${{ github.event.before }}
          PROVENANCE_AFTER: ${{ github.sha }}
