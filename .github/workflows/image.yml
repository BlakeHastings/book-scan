name: Image

# Everything a version tag will do to the image, except the two steps that
# cannot be taken back. The build runs with `push: false, load: true`, the
# contract comparison and the checker run against the loaded image instead of a
# pulled digest, and nothing is published and no release is created. What that
# leaves for the tag to do for the first time is the push itself and
# `gh release create`.
#
# The assertions are not copied: they live in `scripts/check-image.mjs`, which
# both workflows call with the ref they have. Only the build step, which pushes
# there and loads here, is written twice.
#
# It is not filtered by path and must not be. `scripts/merge-pr.mjs` reads a
# required check that never appeared as a refusal, and a job skipped by `if:`
# reports SKIPPED, which it also refuses. So this job always runs and always
# reports as `image (build + contract)`, and asks `scripts/ci-scope.mjs` whether
# the steps inside it are worth doing. That question is narrower than the other
# two jobs ask: see `DECIDES_THE_IMAGE` in `ci-scope.mjs`.
on:
  pull_request:
  # So the whole rehearsal can be run at a commit somebody is about to tag,
  # without pushing the tag to find out. `ci-scope.mjs` answers every trigger
  # that is not a pull request with "build it", so a dispatch is always the full
  # run.
  workflow_dispatch:

# Nothing here logs in to a registry and nothing here writes anything: no
# `packages:` and no `contents: write`, which is the difference between a
# rehearsal and a publication.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: image (build + contract)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Runs on the runner's preinstalled node, before anything is installed.
      # `--image` only chooses which of the script's two questions the log line
      # talks about; both outputs are written either way.
      - name: What this change needs
        id: scope
        run: node scripts/ci-scope.mjs --image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      # `!= 'false'` rather than `== 'true'`, so that anything unexpected, an
      # output that never appeared or a value nobody planned for, builds the
      # image rather than quietly skipping it.
      - uses: docker/setup-buildx-action@v3
        if: steps.scope.outputs.image != 'false'

      # No cache, for the reason `publish.yml` gives and one more: a cached build
      # proves less than a cold one, and what this job is for is finding out that
      # `npm ci` in `node:22-bookworm-slim` has stopped working, which is exactly
      # the layer a cache would hand back without running.
      #
      # No `labels:` either. The ones the tag run sets are properties of a
      # release, and there is no version here.
      - name: Build
        if: steps.scope.outputs.image != 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: book-scan:pr

      # The same assertions `publish.yml` makes, from the same file, against the
      # image this job just built rather than one pulled back by digest.
      - name: The image carries this contract, and its checker runs
        if: steps.scope.outputs.image != 'false'
        run: node scripts/check-image.mjs book-scan:pr

      # `docs/the-image.md` carries the size and where it goes. If this line
      # starts saying something else, that is the note to go and change.
      - name: Say what was built
        if: steps.scope.outputs.image != 'false'
        run: |
          {
            echo "## The image was built and not published"
            echo
            docker image ls book-scan:pr --format 'Size on disk: {{.Size}}'
            echo
            echo "A tag publishes this same build. What a tag still does for the first time is the"
            echo "push itself and \`gh release create\`."
          } >> "$GITHUB_STEP_SUMMARY"
