name: Publish

# The image and the contract, on a version tag and on nothing else.
#
# One immutable tag per release, spelled exactly as the git tag, plus the digest,
# which is the only thing that actually pins a build. `docs/publishing.md`
# argues the version scheme, the registry and the visibility.
#
# Nothing here needs a configured secret, an environment or a variable: it
# authenticates to GHCR with the token GitHub hands every run and addresses the
# registry through `github.repository`. Keep it that way, so that a tag pushed
# on a fork publishes to that fork's own namespace with that fork's own token.

on:
  push:
    tags:
      # A release, and a pre-release of one. Deliberately not `v*`: a tag like
      # `v-wip` should not publish anything.
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions: {}

jobs:
  image:
    name: image and contract
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: write

    steps:
      # Full history, because the ancestry check below needs the default branch.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A tag can be pushed at any commit, including one that never went near a
      # pull request, so nothing is published from a commit that is not on the
      # default branch.
      - name: This tag is on the default branch
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags --quiet origin "$BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$BRANCH"; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on $BRANCH."
            echo "Nothing is published from a commit that has not been reviewed and merged."
            exit 1
          fi
          echo "$GITHUB_REF_NAME is $GITHUB_SHA, which is on $BRANCH."

      # Both of these also run on every pull request. They run again here
      # because a tag is a different commit from the one the pull request
      # checked, and this is the last moment before something immutable exists.
      - name: The contract agrees with the code
        run: node scripts/check-deploy-contract.mjs

      - name: The contract's checkers behave
        run: node scripts/check-deploy-contract.test.mjs

      - name: Where this is going
        id: target
        run: |
          # A registry refuses a repository name with an uppercase letter in it,
          # and `github.repository` carries the owner's name verbatim. Without
          # the fold the push fails with "invalid reference format: repository
          # name must be lowercase".
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

          declared=$(node -e "process.stdout.write(require('./deploy/contract.json').image.reference)")
          if [ "$image" != "$declared" ]; then
            if [ "$GITHUB_REPOSITORY_OWNER" = "BlakeHastings" ]; then
              echo "::error::deploy/contract.json says the image is $declared and this run publishes $image."
              exit 1
            fi
            echo "::notice::Publishing to $image. deploy/contract.json names $declared, which is the upstream image; a fork publishes to its own namespace."
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build cache, deliberately: the layers are 1.49 GB and GitHub's
      # Actions cache is 10 GB for the whole repository, so caching this would
      # evict the npm cache every pull request depends on.
      #
      # The build is itself a gate, but it does not run the test suite, which
      # needs a Postgres. That ran on the pull request this commit came from.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.target.outputs.image }}:${{ steps.target.outputs.version }}
          # The labels that are properties of this build rather than of the
          # Dockerfile, which carries the rest.
          labels: |
            org.opencontainers.image.version=${{ steps.target.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      # This pulls back what was just pushed, by digest rather than by tag, and
      # compares the file inside it against the file in this repository byte for
      # byte. `.gitattributes` keeps `deploy/` at LF for that comparison.
      #
      # Nothing in this workflow puts the image on the runner: the build above is
      # `push: true` with no `load:`, so what it made is in the registry and
      # nowhere else and the script pulls it back. Do not add a local
      # `docker image inspect` precheck, which reads the local store and does not
      # pull, and do not answer one by adding `load: true` above: the registry
      # round trip is half of what this step proves.
      - name: The image carries this exact contract, and its checker runs
        env:
          REF: ${{ steps.target.outputs.image }}@${{ steps.build.outputs.digest }}
        run: node scripts/check-image.mjs "$REF"

      - name: Say what was published
        env:
          IMAGE: ${{ steps.target.outputs.image }}
          VERSION: ${{ steps.target.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## $IMAGE:$VERSION"
            echo
            echo '```'
            echo "$IMAGE@$DIGEST"
            echo '```'
            echo
            echo "Deploy the digest, not the tag. The tag is a name for people; the digest is what pins the build."
            echo
            echo "The contract is attached to the release and is inside the image at \`/app/deploy/contract.json\`."
            echo
            echo "If a signed-out \`docker pull\` of this is refused, the package was created private. That is a"
            echo "one-time setting in the package's own settings page and it is not something a workflow can do"
            echo "for you; \`docs/publishing.md\` says why the image should be public."
          } >> "$GITHUB_STEP_SUMMARY"

      # The release exists so the contract has somewhere to live that is not
      # inside a 1.49 GB pull.
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.target.outputs.image }}
          VERSION: ${{ steps.target.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          notes=$(cat <<EOF
          \`\`\`
          $IMAGE@$DIGEST
          \`\`\`

          Also tagged \`$IMAGE:$VERSION\`. **Deploy the digest.** The tag names this
          release for a person; the digest is the only thing that pins the build, and
          there is deliberately no moving tag to follow.

          \`contract.json\` below is what this image needs: every environment variable,
          the mount that must outlive the container, the port, the bind and the one
          variable that moves it, what happens on start and stop, and what has to be
          beside it. The same file is inside the image at
          \`/app/deploy/contract.json\`, and this workflow compared the two before
          creating this release.

          Check a configuration against it before deploying:

          \`\`\`
          docker run --rm --env-file <yours> $IMAGE@$DIGEST node /app/deploy/check-config.mjs
          \`\`\`

          **Read this first if nothing answers:** by default the server binds
          \`127.0.0.1\` inside the container, so a published port reaches nothing, and
          whatever fronts it has to be in the container's own network namespace. Set
          \`BOOKSCAN_BIND=all\` if you want the container's network to be the boundary
          instead. It takes that word or \`loopback\`, not an address, and it refuses
          anything else at start.
          EOF
          )
          # A version with a hyphen in it is a pre-release, per semver.
          kind=()
          case "$VERSION" in *-*) kind+=(--prerelease) ;; esac

          gh release create "$VERSION" deploy/contract.json \
            --title "$VERSION" \
            --notes "$notes" \
            "${kind[@]}"
