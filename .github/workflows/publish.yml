name: Publish

# The image and the contract, on a version tag and on nothing else (#533).
#
# WHY A TAG AND NOT A PUSH TO master
# Two reasons, and the second is the one that decided it.
#
# The image is 1.49 GB, mostly an OCR runtime that ships every platform's
# prebuilt binaries. Building and pushing that on every commit would be unkind
# to the runner, to the registry and to anybody pulling it.
#
# And a private repository deploying from a moving tag cannot say what is
# running. `latest` answers "whatever was last built", which is not an answer
# during an incident and is not a thing to roll back to. So this publishes one
# immutable tag per release, spelled exactly as the git tag, and records the
# digest, which is the only thing that actually pins a build.
# `docs/publishing.md` argues the version scheme, the registry and the
# visibility.
#
# WHAT THIS WORKFLOW MAY NOT NEED
# No configured secret, no environment, no variable. It authenticates to GHCR
# with the token GitHub hands every run, and it addresses the registry through
# `github.repository`. Nothing here knows a domain, a host or a provider, and
# nothing here requires one to exist — which is the property #533 exists to
# protect, because the moment this repository needs the deployment to be real
# in order to build or test, the two repositories have stopped being separable
# and nobody will notice until somebody forks it.
#
# A fork gets this for free: a tag pushed on a fork publishes to that fork's own
# namespace with that fork's own token, and the steps that assume this
# repository's name step aside rather than fail.

on:
  push:
    tags:
      # A release, and a pre-release of one. Deliberately not `v*`: a tag like
      # `v-wip` should not publish anything.
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

# Nothing by default, and the job asks for the two it needs.
permissions: {}

jobs:
  image:
    name: image and contract
    runs-on: ubuntu-latest

    permissions:
      # Pushing to ghcr.io as this repository. This is the whole reason GHCR was
      # chosen over any other registry: the credential is issued to the run and
      # expires with it, so this repository stores no registry secret at all.
      packages: write
      # Creating the release the contract is attached to.
      contents: write

    steps:
      # Full history, because the ancestry check below needs the default branch.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A tag can be pushed at any commit, including one that never went near a
      # pull request. Everything else in this repository's merge discipline
      # (`scripts/merge-pr.mjs`, `scripts/guard-merge.mjs`,
      # `scripts/check-main-provenance.mjs`) exists to stop unreviewed code
      # reaching the default branch, and publishing an image would walk straight
      # past all three. So: a version is a commit on the default branch, or it
      # is not a version.
      - name: This tag is on the default branch
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags --quiet origin "$BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$BRANCH"; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on $BRANCH."
            echo "Nothing is published from a commit that has not been reviewed and merged."
            exit 1
          fi
          echo "$GITHUB_REF_NAME is $GITHUB_SHA, which is on $BRANCH."

      # The contract is the thing being published, so it is checked before the
      # 1.49 GB build rather than after. Both of these also run on every pull
      # request; they run again here because a tag is a different commit from
      # the one the pull request checked, and this is the last moment before
      # something immutable is created.
      - name: The contract agrees with the code
        run: node scripts/check-deploy-contract.mjs

      - name: The contract's checkers behave
        run: node scripts/check-deploy-contract.test.mjs

      - name: Where this is going
        id: target
        run: |
          # A registry refuses a repository name with an uppercase letter in it,
          # and this repository's owner has two. `github.repository` is
          # `BlakeHastings/book-scan` verbatim, so this is not tidiness: without
          # the fold, the push fails with "invalid reference format: repository
          # name must be lowercase".
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

          declared=$(node -e "process.stdout.write(require('./deploy/contract.json').image.reference)")
          if [ "$image" != "$declared" ]; then
            if [ "$GITHUB_REPOSITORY_OWNER" = "BlakeHastings" ]; then
              echo "::error::deploy/contract.json says the image is $declared and this run publishes $image."
              exit 1
            fi
            echo "::notice::Publishing to $image. deploy/contract.json names $declared, which is the upstream image; a fork publishes to its own namespace."
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build cache, deliberately. This runs a few times a year, the layers
      # are 1.49 GB, and GitHub's Actions cache is 10 GB for the whole
      # repository. Caching this would evict the npm cache every pull request
      # depends on, to save minutes on a job nobody is waiting for.
      #
      # The build is also the gate: the `build` stage runs `npm run build`,
      # which typechecks, and `production-tree` runs the smoke check that loads
      # the bundle after the prune. A tree that fails either one fails here,
      # before the push. What it does NOT run is the test suite, which needs a
      # Postgres; that ran on the pull request this commit came from.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.target.outputs.image }}:${{ steps.target.outputs.version }}
          # The three labels that are properties of this build rather than of
          # the Dockerfile, which carries the rest.
          labels: |
            org.opencontainers.image.version=${{ steps.target.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      # THE STEP THAT MAKES "VERSIONED WITH THE IMAGE" A FACT.
      #
      # The contract is only worth anything if the image a consumer pulls
      # carries the contract that describes it. So this pulls back what was just
      # pushed, by digest rather than by tag, and compares the file inside it
      # against the file in this repository byte for byte. `.gitattributes`
      # keeps `deploy/` at LF for this comparison.
      - name: The image carries this exact contract
        env:
          REF: ${{ steps.target.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          docker run --rm --entrypoint cat "$REF" /app/deploy/contract.json > from-image.json
          if ! diff -u deploy/contract.json from-image.json; then
            echo "::error::The image's contract is not this repository's contract."
            exit 1
          fi
          echo "The contract inside $REF is identical to deploy/contract.json."

      # And the checker inside it runs, rather than merely being present. A file
      # that is copied in and never executed is how a shipped tool turns out to
      # have been broken for months.
      - name: The checker inside the image runs
        env:
          REF: ${{ steps.target.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          set +e
          docker run --rm "$REF" node /app/deploy/check-config.mjs > empty.txt 2>&1
          empty=$?
          docker run --rm -e 'ConnectionStrings__bookscan=postgres://u:p@db:5432/bookscan' \
            "$REF" node /app/deploy/check-config.mjs > ok.txt 2>&1
          good=$?
          set -e
          cat empty.txt
          if [ "$empty" -ne 1 ]; then
            echo "::error::The checker accepted an environment with no connection string."
            exit 1
          fi
          if [ "$good" -ne 0 ]; then
            echo "::error::The checker refused a configuration that is correct."
            cat ok.txt
            exit 1
          fi
          echo "The checker refuses what it should and passes what it should."

      - name: Say what was published
        env:
          IMAGE: ${{ steps.target.outputs.image }}
          VERSION: ${{ steps.target.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## $IMAGE:$VERSION"
            echo
            echo '```'
            echo "$IMAGE@$DIGEST"
            echo '```'
            echo
            echo "Deploy the digest, not the tag. The tag is a name for people; the digest is what pins the build."
            echo
            echo "The contract is attached to the release and is inside the image at \`/app/deploy/contract.json\`."
            echo
            echo "If a signed-out \`docker pull\` of this is refused, the package was created private. That is a"
            echo "one-time setting in the package's own settings page and it is not something a workflow can do"
            echo "for you; \`docs/publishing.md\` says why the image should be public."
          } >> "$GITHUB_STEP_SUMMARY"

      # The release exists so the contract has somewhere to live that is not
      # inside a 1.49 GB pull. A consumer's CI can fetch one small JSON file
      # from here and check its own configuration without pulling anything.
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.target.outputs.image }}
          VERSION: ${{ steps.target.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          notes=$(cat <<EOF
          \`\`\`
          $IMAGE@$DIGEST
          \`\`\`

          Also tagged \`$IMAGE:$VERSION\`. **Deploy the digest.** The tag names this
          release for a person; the digest is the only thing that pins the build, and
          there is deliberately no moving tag to follow.

          \`contract.json\` below is what this image needs: every environment variable,
          the mount that must outlive the container, the port, the loopback bind, what
          happens on start and stop, and what has to be beside it. The same file is
          inside the image at \`/app/deploy/contract.json\`, and this workflow compared
          the two before creating this release.

          Check a configuration against it before deploying:

          \`\`\`
          docker run --rm --env-file <yours> $IMAGE@$DIGEST node /app/deploy/check-config.mjs
          \`\`\`

          **Read this first if nothing answers:** the server binds \`127.0.0.1\` inside
          the container, so a published port reaches nothing. Whatever fronts it has to
          be in the container's own network namespace.
          EOF
          )
          # A version with a hyphen in it is a pre-release, per semver, and
          # GitHub should say so rather than offer it as the current release.
          kind=()
          case "$VERSION" in *-*) kind+=(--prerelease) ;; esac

          gh release create "$VERSION" deploy/contract.json \
            --title "$VERSION" \
            --notes "$notes" \
            "${kind[@]}"
