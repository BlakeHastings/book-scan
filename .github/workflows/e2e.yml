name: End to end

# This gates pull requests, and also runs nightly.
#
# It is deliberately NOT filtered by path, and must not be.
# `scripts/merge-pr.mjs` treats a required check that never ran as a refusal, so
# a `paths:` filter that skipped this job on a docs-only pull request would
# block every such pull request instead of speeding it up. A job-level `if:` is
# no better: a skipped job reports SKIPPED, and the guard accepts only SUCCESS
# or NEUTRAL. The job therefore always runs and always reports as
# `browser journeys`, and asks `scripts/ci-scope.mjs` whether the steps inside
# it are worth doing.
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

# `ci-scope.mjs` asks the API which files this pull request touches, and the
# default token cannot read pull requests unless it is asked to. Without this it
# gets `403 Forbidden` and falls back to running everything.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journeys:
    name: browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Runs on the runner's preinstalled node, before anything is installed.
      # Every non-pull-request trigger above, the nightly schedule and a manual
      # dispatch, is answered "full run" by the script, so the nightly cannot be
      # hollowed out by this.
      - name: What this change needs
        id: scope
        run: node scripts/ci-scope.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.docs_only != 'true'
        with:
          node-version: 22

      # Covers the three npm trees this job installs: the app, the AppHost at the
      # repository root, and the suite. By hand rather than through setup-node's
      # `cache: npm`, for the `restore-keys` fallback.
      - name: Cache the npm downloads
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-e2e-${{ runner.os }}-${{ hashFiles('web/package-lock.json', 'package-lock.json', 'e2e/package-lock.json') }}
          restore-keys: |
            npm-e2e-${{ runner.os }}-

      # Keyed on the suite's lock file, so a Playwright bump fetches the browser
      # that version wants rather than reusing the previous one.
      - name: Cache the browser
        id: browser-cache
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      # Pinned so a merge gate cannot change toolchain without a commit, and
      # pinned to `aspire.config.json` rather than to a second number here, so
      # there is nothing to keep in step by hand. Not cached: the download takes
      # about four seconds and nothing in this job waits on it.
      - name: Install the Aspire CLI
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          version="$(node -p "require('./aspire.config.json').sdk.version")"
          curl -sSL https://aspire.dev/install.sh | bash -s -- --version "$version"
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"
          "$HOME/.aspire/bin/aspire" --version

      # `scripts/npm-install.mjs` runs `npm ci` and retries it a bounded number
      # of times, but only when the failure looks like a connection that timed
      # out rather than a dependency that genuinely cannot be installed.
      #
      # These three are the installs that do the work. The AppHost's run of the
      # same script minutes later finds `web/node_modules` already matching the
      # lock file this step installed from and does nothing.
      - name: Install the app
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: node ../scripts/npm-install.mjs

      - name: Install the AppHost
        if: steps.scope.outputs.docs_only != 'true'
        run: node scripts/npm-install.mjs

      - name: Install the suite
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: e2e
        run: node ../scripts/npm-install.mjs

      # The browser binary comes from the cache when it hits; the OS packages
      # it links against are installed either way, because they live outside
      # the cached directory and a runner image refresh can drop them.
      - name: Install Chromium
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: e2e
        run: |
          if [ "${{ steps.browser-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      # The camera is a generated video file and the catalogue lookups are
      # answered by a stub the suite starts itself, so this needs no network
      # beyond the installs above and never reaches real scan data: the AppHost
      # puts the database in web/data/e2e/<run id>.
      - name: Run the journeys
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: e2e
        run: npm test

      # This cannot fail the job: the failure it is explaining has already been
      # reported by the step above.
      #
      # `aspire ps` and `aspire logs` both ask a running AppHost, so when
      # `aspire start` is what failed they answer "No running AppHost found" and
      # the CLI's own files under `~/.aspire/logs/` are the only account of what
      # happened. They are bounded to the tail, because a run that restores
      # several hundred NuGet packages writes megabytes of
      # "PackageSignatureVerificationLog".
      - name: What the AppHost said, if anything failed
        if: failure() && steps.scope.outputs.docs_only != 'true'
        continue-on-error: true
        timeout-minutes: 3
        run: |
          aspire ps --non-interactive || true
          aspire logs --tail 400 --timestamps --non-interactive || true
          for log in "$HOME"/.aspire/logs/*.log; do
            [ -e "$log" ] || continue
            echo "===== $log ====="
            tail -c 20000 "$log"
          done

      - name: Keep the report
        if: always() && steps.scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
