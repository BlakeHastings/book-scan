name: End to end

# This gates pull requests, and also runs nightly.
#
# It used to be nightly and on demand only, on the reasoning that the Aspire
# CLI, a browser and two npm trees do not belong on the fast path. That
# reasoning cost more than it saved: #99 merged green while breaking browser
# scenarios and nobody knew until the next morning's run, and the alternative
# was a human running the suite by hand before shipping, which is the manual
# step this repository exists to not have.
#
# It is deliberately NOT filtered by path, and must not be. `scripts/merge-pr.mjs`
# treats a required check that never ran as a refusal, so a `paths:` filter that
# skipped this job on a docs-only pull request would block every such pull
# request instead of speeding it up. A job-level `if:` is no better: a skipped
# job reports SKIPPED, and the guard accepts only SUCCESS or NEUTRAL.
#
# The job therefore always runs and always reports as `browser journeys`, and
# asks `scripts/ci-scope.mjs` whether the steps inside it are worth doing. On a
# documentation only change it starts, finds nothing to prove, and finishes
# green in seconds. See the top of that script for the whole argument.
on:
  pull_request:
  workflow_dispatch:
  schedule:
    # 04:00 UTC, so a broken journey is waiting in the morning.
    - cron: '0 4 * * *'

# `ci-scope.mjs` asks the API which files this pull request touches, and the
# default token cannot read pull requests unless it is asked to. Without this it
# gets `403 Forbidden`, falls back to "run everything" and quietly costs the
# full five minutes on a README change. Measured, not guessed: run 30966770067
# did exactly that. Kept to the two scopes actually used.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journeys:
    name: browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Runs on the runner's preinstalled node, before anything is installed, so
      # a documentation only pull request pays for a checkout and nothing else.
      # Every non-pull-request trigger above, the nightly schedule and a manual
      # dispatch, is answered "full run" by the script, so the nightly cannot be
      # hollowed out by this.
      - name: What this change needs
        id: scope
        run: node scripts/ci-scope.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.docs_only != 'true'
        with:
          node-version: 22

      # Covers the three npm trees this job installs: the app, the AppHost at
      # the repository root, and the suite. By hand rather than through
      # setup-node's `cache: npm`, for the `restore-keys` fallback. Worth
      # slightly more here than in `ci.yml`, because this workflow reaches the
      # default branch only through the nightly schedule, so the shared entry
      # every pull request reads is refreshed once a day at best.
      #
      # Read the note in `ci.yml` before quoting a saving for this: the measured
      # difference between a warm and a cold `npm ci` here is a few seconds, not
      # a billed minute.
      - name: Cache the npm downloads
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-e2e-${{ runner.os }}-${{ hashFiles('web/package-lock.json', 'package-lock.json', 'e2e/package-lock.json') }}
          restore-keys: |
            npm-e2e-${{ runner.os }}-

      # Chrome for Testing is around a hundred megabytes and the download is
      # the second largest step here after the run itself. Keyed on the suite's
      # lock file, so a Playwright bump fetches the browser that version wants
      # rather than reusing the previous one.
      - name: Cache the browser
        id: browser-cache
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      # Not cached on purpose. It takes about four seconds, and a cached copy
      # would pin the CLI version until something else in the key changed,
      # which is the wrong trade for four seconds.
      - name: Install the Aspire CLI
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          curl -sSL https://aspire.dev/install.sh | bash
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"

      # `scripts/npm-install.mjs` runs `npm ci` and retries it a bounded number
      # of times, but only when the failure looks like a connection that timed
      # out rather than a dependency that genuinely cannot be installed (#342).
      # `web`'s onnxruntime-node fetches its own binary during install, from a
      # host the runner sometimes cannot reach; the same failure can happen
      # again below, in "Run the journeys", as the AppHost's own install of the
      # same tree (covered in apphost.mts by the same script), which is why a
      # fix only here would not have been enough.
      - name: Install the app
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: node ../scripts/npm-install.mjs

      - name: Install the AppHost
        if: steps.scope.outputs.docs_only != 'true'
        run: node scripts/npm-install.mjs

      - name: Install the suite
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: e2e
        run: node ../scripts/npm-install.mjs

      # The browser binary comes from the cache when it hits; the OS packages
      # it links against are installed either way, because they live outside
      # the cached directory and a runner image refresh can drop them.
      - name: Install Chromium
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: e2e
        run: |
          if [ "${{ steps.browser-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      # The camera is a generated video file and the catalogue lookups are
      # answered by a stub the suite starts itself, so this needs no network
      # beyond the installs above and never reaches real scan data: the
      # AppHost puts the database in web/data/e2e/<run id>.
      #
      # The Aspire bundle this pulls down is NOT cached. That was measured on
      # wall clock once and re-measured on billed minutes for #126, and the
      # answer got firmer rather than closer.
      #
      # The experiment: cache `~/.aspire/versions` and `~/.nuget/packages`, run
      # this workflow twice on the same branch, once to populate and once to
      # hit. Run 30966851528, everything cold, took 2m36s. Run 30967066322,
      # 719M restored in 6s, took 2m37s. The scenarios step was 1m25s cold and
      # 1m36s warm, so the difference is noise and points the wrong way. Both
      # runs are billed 3 minutes. There is no minute here to save.
      #
      # If you revisit it, the thing to beat is 2m37s, and the boundary that
      # would actually pay is 2m00s.
      - name: Run the journeys
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: e2e
        run: npm test

      # The backstop for #277, and the reason it is a second capture rather than
      # the only one: the suite itself prints every resource's state and console
      # output when `aspire wait` is what failed, which is the shape that flake
      # took, and it can print nothing at all if the harness never reached that
      # line. An `aspire start` that fails, a crash in the camera fixture, a
      # cancelled step: this asks the AppHost directly, whatever went wrong.
      #
      # It cannot fail the job. The failure it is explaining has already been
      # reported by the step above, and diagnostics that turn a red run into a
      # differently red one are worse than none. If the run got as far as global
      # teardown the AppHost has been stopped, and this says there is nothing
      # running, which is itself an answer.
      - name: What the AppHost said, if anything failed
        if: failure() && steps.scope.outputs.docs_only != 'true'
        continue-on-error: true
        timeout-minutes: 3
        run: |
          aspire ps --non-interactive || true
          aspire logs --tail 400 --timestamps --non-interactive || true

      - name: Keep the report
        if: always() && steps.scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
