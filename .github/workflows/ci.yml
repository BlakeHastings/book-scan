name: CI

# Pull requests only.
#
# There used to be a `push: branches: [master]` trigger here as well, and it
# re-proved the same tree twice. Merges land only through
# `scripts/merge-pr.mjs`, which squashes and refuses unless every required
# check is already green, and GitHub runs pull request checks against the merge
# commit it computes from the branch and the base. The push run therefore built
# a tree that had just been built.
#
# Checked before removing it: nothing uses `workflow_run`, no README carries a
# status badge, branch protection is unavailable on this plan so no ruleset
# names a CI context, and `provenance.yml` has its own independent `push`
# trigger and still runs on every merge. `e2e.yml` also still runs nightly on
# the default branch, so master keeps a daily full browser signal.
on:
  pull_request:

# `ci-scope.mjs` asks the API which files this pull request touches, and the
# default token cannot read pull requests unless it is asked to. Without this it
# gets `403 Forbidden`, falls back to "run everything" and quietly costs the
# full five minutes on a README change. Measured, not guessed: run 30966770067
# did exactly that. Kept to the two scopes actually used.
permissions:
  contents: read
  pull-requests: read

# A second push to a PR makes the first run irrelevant. Cancel it.
# Confirmed cancelling rather than assumed: runs 30964083948 and 30962802311
# both ended `cancelled` when a later push superseded them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job, not two. `no production data committed` used to be a job of its
  # own and took about five seconds; GitHub bills each job rounded up to a whole
  # minute, so those five seconds cost exactly as much as this whole job does.
  # It is now the first step here, and it also runs after a merge in
  # `provenance.yml`, so it is checked in more places than before for less
  # money. `REQUIRED` in `scripts/merge-pr.mjs` was updated in the same change.
  web:
    name: web (typecheck + tests)
    runs-on: ubuntu-latest

    # Since stage F of the Postgres migration, the four test files that open a
    # database run twice, once against SQLite and once against a real Postgres.
    # Locally that container is started by @testcontainers/postgresql; here it
    # is a service container, so the pull overlaps checkout and `npm ci` instead
    # of being paid for in series inside the test step.
    #
    # It also means the two paths into the harness are each exercised by
    # somebody on every change: a developer takes the container path, CI takes
    # the BOOKSCAN_TEST_DATABASE_URL escape hatch below. Neither is a code path
    # nobody runs until it breaks.
    #
    # Pinned to the major version in `postgres-version.json`, which is the one
    # place it is written. That is the version the eventual managed target will
    # run, and collation behaviour is a property of the server and the libc it
    # was built against, so this is a decision rather than a default to refresh.
    #
    # It is a literal here and nowhere else, because `services.<id>.image` is
    # evaluated before any step runs and the `env` context is not available to
    # it, so it cannot be read out of a file. `check-postgres-version.mjs`, run
    # as a step below, fails the job if this literal and that file disagree.
    # Change one, change both.
    #
    # A service container starts whatever the steps below decide to do, so a
    # documentation-only run pays for it too. Measured against the alternative
    # and kept: that run is a handful of seconds either way and GitHub bills a
    # job rounded up to a whole minute, so it costs the same minute it did.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Without this the test step can reach a container that is listening
        # and not yet accepting connections, which fails as a connection reset
        # and reads as a flaky driver.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # First, and never conditional on what the change touched. Any change at
      # all can commit a database or a scan image, including one whose other
      # steps are about to be skipped as documentation.
      - name: No production data committed
        run: bash scripts/check-no-scan-data.sh

      # Also unconditional, and for the same kind of reason: the service
      # container above has already started by the time any step runs, so if its
      # tag disagrees with `postgres-version.json` the tests below would prove a
      # different database from the one the AppHost runs. That is #162, and this
      # is what stops it coming back. Node is the runner's preinstalled one, as
      # for the scope script below, so this costs nothing on a docs-only run.
      - name: Postgres version is written once
        run: node scripts/check-postgres-version.mjs

      # Runs on the runner's preinstalled node, before setup-node, so a
      # documentation only pull request never pays for a toolchain either.
      #
      # This decides whether the steps below do anything. It does NOT decide
      # whether this job runs: see the comment at the top of the script. The job
      # always runs and always reports under this name, because
      # `scripts/merge-pr.mjs` reads a missing required check as a refusal.
      - name: What this change needs
        id: scope
        run: node scripts/ci-scope.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.docs_only != 'true'
        with:
          node-version: 22

      # The npm download cache, kept by hand rather than through setup-node's
      # `cache: npm`, purely so it can have `restore-keys`.
      #
      # This is the one thing that turned out to depend on the push to master
      # run, and it took looking rather than reasoning. GitHub scopes a cache
      # written by a pull request run to that pull request's own merge ref, so
      # only a run on the default branch writes one every pull request can read.
      # In `gh api repos/{owner}/{repo}/actions/caches`, the entry
      # `node-cache-Linux-x64-npm-1dcb3a6...` sits on `refs/heads/master` and was
      # last read at 01:39:19 by pull request run 30967006278. The push run is
      # what wrote it, and nothing writes master's scope now, so the day
      # `web/package-lock.json` changes the exact key stops matching for good.
      #
      # Then it was measured, and the honest number is small. `npm ci` took 15s
      # against that shared cache (run 30967006278) and 19s with `~/.npm` empty
      # (run 30967390466, the first run on this new key, nothing to restore).
      # Four seconds, well inside the same billed minute. So this is not a
      # minute saved, it is a silent dependency removed for free: `restore-keys`
      # makes a lock file change a delta install against the previous entry, and
      # the read keeps that entry from being evicted.
      #
      # Do not restate this as a billed-minute saving. It is not one.
      - name: Cache the npm downloads
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-web-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            npm-web-${{ runner.os }}-

      - name: Install
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npm ci

      - name: Typecheck
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npm run typecheck

      # The layering from #169, checked rather than reviewed. A domain file that
      # imports from infrastructure is the defect that epic exists to prevent,
      # and a boundary nobody has watched fail is not enforced. Deliberately a
      # step of this job rather than a job of its own: it takes about a second,
      # and GitHub bills a job rounded up to a whole minute.
      #
      # Verified by breaking it. The pull request that added this pushed an
      # import from web/domain into web/infrastructure first and watched this
      # step go red before taking it out.
      - name: Layer boundaries
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npm run lint:layers

      # Tests open :memory: SQLite databases and scratch Postgres databases
      # created on the service container above, and generate their own barcode
      # and cover fixtures, so this never reaches real scan data.
      #
      # BOOKSCAN_TEST_DATABASE_URL is the only connection variable the harness
      # reads, deliberately: not DATABASE_URL and not ConnectionStrings__*, so
      # an ambient one cannot point a test run at a real catalogue. See
      # web/server/pgcontainer.ts.
      - name: Tests
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npm test
        env:
          BOOKSCAN_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      # Three script suites, none of which needs a dependency tree. They run
      # here rather than in jobs of their own because a job is billed rounded up
      # to a whole minute and these take about a second between them.
      #
      # The merge guard is the thing standing between an agent and an unreviewed
      # commit on master, and it had no tests until it had shipped two defects.
      # `ci-scope.mjs` decides which steps above get skipped, so a bug in it is a
      # suite silently not running. Both live under `scripts/`, which
      # `ci-scope.mjs` never treats as documentation, so any change to either one
      # forces the full run that tests it.
      - name: Merge guard behaves
        if: steps.scope.outputs.docs_only != 'true'
        run: node scripts/guard-merge.test.mjs

      # The other half of the merge path. `guard-merge.mjs` decides which
      # commands may run; `merge-pr.mjs` decides whether a pull request may
      # land, and since #154 that includes whether its checks ran against the
      # base as it stands now. A stale-base gate nobody exercises is how the
      # first version of this tooling shipped two defects.
      - name: Merge gate behaves
        if: steps.scope.outputs.docs_only != 'true'
        run: node scripts/merge-pr.test.mjs

      - name: Scope rules
        if: steps.scope.outputs.docs_only != 'true'
        run: node scripts/ci-scope.test.mjs
