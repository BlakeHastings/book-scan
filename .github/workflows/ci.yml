name: CI

# Pull requests only. Merges land through `scripts/merge-pr.mjs`, which refuses
# unless every required check is already green, and GitHub runs pull request
# checks against the merge commit it computes from the branch and the base.
#
# `web (typecheck + tests)` is named here, in `REQUIRED` in
# `scripts/merge-pr.mjs` and in `docs/process/master-ruleset.json`. Change the
# name in all three: a required check that never reports makes master
# unmergeable.
#
# `e2e (typecheck)` is named here and nowhere else on purpose. It is advisory
# and gates nothing. Do not complete it by adding it to the other two files.
on:
  pull_request:

# `ci-scope.mjs` asks the API which files this pull request touches, and the
# default token cannot read pull requests unless it is asked to. Without this it
# gets `403 Forbidden` and falls back to running everything.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (typecheck + tests)
    runs-on: ubuntu-latest

    # The tag is a literal here and nowhere else, because `services.<id>.image`
    # is evaluated before any step runs and the `env` context is not available
    # to it, so it cannot be read out of a file. `check-postgres-version.mjs`,
    # run as a step below, fails the job if this literal and
    # `postgres-version.json` disagree. Change one, change both.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Without this the test step can reach a container that is listening and
        # not yet accepting connections, which fails as a connection reset and
        # reads as a flaky driver.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # Never conditional on what the change touched: any change at all can
      # commit a database or a scan image, including one whose other steps are
      # about to be skipped as documentation.
      - name: No production data committed
        run: bash scripts/check-no-scan-data.sh

      # Also unconditional. The service container above has already started by
      # the time any step runs, so a tag disagreeing with
      # `postgres-version.json` would have the tests below prove a different
      # database from the one the AppHost runs.
      - name: Postgres version is written once
        run: node scripts/check-postgres-version.mjs

      # Runs on the runner's preinstalled node, before setup-node, so a
      # documentation only pull request never pays for a toolchain.
      #
      # This decides whether the steps below do anything. It does not decide
      # whether this job runs: the job always runs and always reports under this
      # name, because `scripts/merge-pr.mjs` reads a missing required check as a
      # refusal.
      - name: What this change needs
        id: scope
        run: node scripts/ci-scope.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.docs_only != 'true'
        with:
          node-version: 22

      # Kept by hand rather than through setup-node's `cache: npm`, purely so it
      # can have `restore-keys`, which makes a lock file change a delta install
      # against the previous entry.
      - name: Cache the npm downloads
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-web-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            npm-web-${{ runner.os }}-

      # `scripts/npm-install.mjs` runs `npm ci` and retries it a bounded number
      # of times, but only when the failure looks like a connection that timed
      # out rather than a dependency that genuinely cannot be installed.
      - name: Install
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: node ../scripts/npm-install.mjs

      - name: Typecheck
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npm run typecheck

      - name: Layer boundaries
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npm run lint:layers

      # BOOKSCAN_TEST_DATABASE_URL is the only connection variable the harness
      # reads, deliberately: not DATABASE_URL and not ConnectionStrings__*, so
      # an ambient one cannot point a test run at a real catalogue. See
      # web/server/pgcontainer.ts.
      - name: Tests
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npm test
        env:
          BOOKSCAN_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      # `npm run build` and not its two halves, deliberately: the script a
      # deployment runs is the script this proves.
      - name: Build
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: npm run build

      - name: The built server loads
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: web
        run: node scripts/smoke-built-server.mjs

      # The script suites. `scripts/` is never treated as documentation by
      # `ci-scope.mjs`, so any change to one of them forces the run that tests it.
      - name: Merge guard behaves
        if: steps.scope.outputs.docs_only != 'true'
        run: node scripts/guard-merge.test.mjs

      - name: Live-data guard behaves
        if: steps.scope.outputs.docs_only != 'true'
        run: node scripts/guard-live-data.test.mjs

      - name: Backup freshness check behaves
        if: steps.scope.outputs.docs_only != 'true'
        run: node scripts/check-backup-freshness.test.mjs

      - name: Merge gate behaves
        if: steps.scope.outputs.docs_only != 'true'
        run: node scripts/merge-pr.test.mjs

      - name: Worktree sweep behaves
        if: steps.scope.outputs.docs_only != 'true'
        run: node scripts/prune-worktrees.test.mjs

      - name: Scope rules
        if: steps.scope.outputs.docs_only != 'true'
        run: node scripts/ci-scope.test.mjs

      # Runs here rather than only in `publish.yml`, because a tag is too late
      # to find out.
      - name: The deployment contract matches the code
        if: steps.scope.outputs.docs_only != 'true'
        run: node scripts/check-deploy-contract.mjs

      - name: The contract's checkers behave
        if: steps.scope.outputs.docs_only != 'true'
        run: node scripts/check-deploy-contract.test.mjs

      - name: The stable launcher matches the contract and names no machine
        if: steps.scope.outputs.docs_only != 'true'
        run: node scripts/check-stable-launcher.mjs

      # Driven with PowerShell, which the runner has. None of these refusals
      # reaches a decryption, so none of them needs the owner's machine.
      - name: The stable launcher refuses what it must
        if: steps.scope.outputs.docs_only != 'true'
        run: node scripts/check-stable-launcher.test.mjs

      - name: Leak check classifies correctly
        if: steps.scope.outputs.docs_only != 'true'
        run: node scripts/check-leaks.test.mjs

      - name: Install retry classifies failures correctly
        if: steps.scope.outputs.docs_only != 'true'
        run: node scripts/npm-install.test.mjs

      - name: The usability harness judges a task correctly
        if: steps.scope.outputs.docs_only != 'true'
        run: node e2e/ux/tasks.test.mjs

  # Playwright transpiles TypeScript with esbuild and never typechecks it, so
  # without this job `e2e/` reaches master untyped.
  #
  # A job of its own because a step of a required job would gate the merge from
  # its first run. This name is deliberately not in `REQUIRED` in
  # `scripts/merge-pr.mjs` and not in `docs/process/master-ruleset.json`.
  #
  # It always runs and always reports under this name, with no `paths:` filter
  # and no job-level `if:`, because the merge gate reads an absent check as
  # never having run and a skipped one as not green.
  e2e-typecheck:
    name: e2e (typecheck)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # On the runner's preinstalled node, before setup-node. This decides
      # whether the steps below do anything, not whether this job runs.
      - name: What this change needs
        id: scope
        run: node scripts/ci-scope.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.docs_only != 'true'
        with:
          node-version: 22

      # `e2e/` has its own `package.json` and lock file; its tree is not `web/`'s.
      - name: Install the suite
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: e2e
        run: node ../scripts/npm-install.mjs

      # `e2e/tsconfig.json` excludes `.features-gen`, which bddgen writes from
      # the `.feature` files on every run.
      - name: Typecheck the suite
        if: steps.scope.outputs.docs_only != 'true'
        working-directory: e2e
        run: npm run typecheck
