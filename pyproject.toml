[project]
name = "book-scan"
version = "1.0.0"
description = "Catalogue a physical book collection from a live camera feed"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.10",
    "pyzbar>=0.1.9",
    "pytesseract>=0.3.13",
    "Pillow>=10.4",
    "requests>=2.32",
    "numpy>=2.0",
    "pygrabber>=0.2",
]

[project.scripts]
book-scan = "bookscan.app:main"

[dependency-groups]
# python-barcode generates real EAN-13 images for the test suite. It is not
# needed to run the app.
dev = ["python-barcode>=0.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bookscan"]
